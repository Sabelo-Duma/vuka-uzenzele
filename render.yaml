# Render.com blueprint — deploys Vuka Uzenzele as one Docker web service
# (API + SPA). Push this repo to GitHub, then: Render → New → Blueprint →
# pick the repo. Everything below is provisioned automatically.
services:
  - type: web
    name: vuka-uzenzele
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt          # closest Render region to South Africa
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VUKA_JWT_SECRET
        generateValue: true    # Render generates a strong secret
      # Encrypts payout details (bank account numbers) at rest. Without it the
      # banking endpoints refuse to store anything in production.
      - key: VUKA_ENCRYPTION_KEY
        generateValue: true
      # PERSISTENCE (recommended): point at a Postgres database (e.g. Supabase,
      # free tier) and all data — including real sign-ups — survives every deploy.
      # Set this in the Render dashboard → Environment (kept out of git):
      #   DATABASE_URL = postgresql://...supabase connection string...
      # Without it, the app falls back to an ephemeral SQLite file (demo only,
      # reseeds on each deploy).
      - key: DATABASE_URL
        sync: false            # you paste the Supabase URL in the dashboard
      # Turns on the ops routes that review ID verifications, triage safety
      # reports and decide formal applications. Generated here so those queues
      # have a reviewer from the first deploy; read it from the dashboard and
      # send it as the x-admin-token header.
      - key: VUKA_ADMIN_TOKEN
        generateValue: true
      # Web push (free): job alerts, hire notices and confirmations, with no SMS
      # contract. These MUST be a matching pair — generate them once with
      # `npm run vapid:keys` in vuka-server and paste both in the dashboard.
      # Regenerating them silently invalidates every existing subscription, so
      # they are deliberately not auto-generated here.
      - key: VUKA_VAPID_PUBLIC_KEY
        sync: false
      - key: VUKA_VAPID_PRIVATE_KEY
        sync: false
      - key: VUKA_VAPID_SUBJECT
        sync: false            # mailto: address a push service can contact
      # Optional: ship errors to Sentry's free tier so they survive a restart.
      # Unset, errors are still captured in the log and at GET /api/admin/errors.
      - key: SENTRY_DSN
        sync: false
