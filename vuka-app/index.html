<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E355A" />
  <meta name="description" content="Vuka Uzenzele — connect South Africa's youth to work. Start with no CV. Let your work write it for you." />
  <title>Vuka Uzenzele — Rise up &amp; do it for yourself</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vuka" />
  <!-- No-flash theme bootstrap: set data-theme before first paint. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem('gj-theme');
        // Default to light (white) on first load; remember an explicit choice.
        var t = v === 'light' || v === 'dark' ? v : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* default stays light */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
